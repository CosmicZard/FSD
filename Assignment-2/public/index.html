<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Library Management System</h1>
        <p>Manage your books easily</p>
    </header>

    <main>

        <section class="form-section">

            <h2 id="formTitle">Add New Book</h2>

            <form id="bookForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Book Title"
                    required
                >

                <input
                    type="text"
                    id="author"
                    placeholder="Author Name"
                    required
                >

                <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
                >

                <input
                    type="number"
                    id="year"
                    placeholder="Publication Year"
                    required
                >

                <button type="submit" id="submitBtn">
                    Add Book
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </form>

        </section>


        <section class="books-section">

            <div class="section-heading">
                <h2>📖 All Books</h2>

                <input
                    type="text"
                    id="search"
                    placeholder="Search books..."
                    oninput="searchBooks()"
                >
            </div>

            <div id="bookContainer"></div>

        </section>

    </main>

    <footer>
        <p>Library Management System | Node.js + Express.js</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
